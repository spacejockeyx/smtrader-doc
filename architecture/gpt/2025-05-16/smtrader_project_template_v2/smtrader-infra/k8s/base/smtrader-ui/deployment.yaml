apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtrader-ui
  namespace: smtrader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtrader-ui
  template:
    metadata:
      labels:
        app: smtrader-ui
    spec:
      containers:
        - name: smtrader-ui
          image: smtrader-ui:latest
          ports:
            - containerPort: 3000