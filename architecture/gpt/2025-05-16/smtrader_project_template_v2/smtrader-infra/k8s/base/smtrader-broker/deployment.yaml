apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtrader-broker
  namespace: smtrader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtrader-broker
  template:
    metadata:
      labels:
        app: smtrader-broker
    spec:
      containers:
        - name: smtrader-broker
          image: smtrader-broker:latest
          ports:
            - containerPort: 8001